name: بناء تطبيق زهرة APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "زهرة APK — Build ${{ github.run_number }}"
          body: |
            ## تطبيق زهرة — نسخة جديدة

            ### كيفية التثبيت على الهاتف:
            1. حمّل ملف `zahra-debug.apk` أدناه
            2. افتح الملف على هاتفك الأندرويد
            3. اسمح بتثبيت التطبيقات من مصادر غير معروفة عند الطلب
            4. اضغط تثبيت

            > ملاحظة: هذه نسخة تجريبية (debug). للنشر على Google Play اتصل بنا.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: zahra-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
