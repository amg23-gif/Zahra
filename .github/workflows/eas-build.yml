name: بناء تطبيق زهرة APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Disable minification and fix gradle
        run: |
          # Disable R8/ProGuard (causes issues in CI)
          sed -i 's/def enableProguardInReleaseBuilds = .*/def enableProguardInReleaseBuilds = false/' android/app/build.gradle || true
          # Increase Gradle JVM memory
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Create signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/zahra.keystore \
            -alias zahra -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Zahra,O=Zahra,C=MA" \
            -storepass zahra123 -keypass zahra123 -noprompt

      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/zahra.keystore \
            -Pandroid.injected.signing.store.password=zahra123 \
            -Pandroid.injected.signing.key.alias=zahra \
            -Pandroid.injected.signing.key.password=zahra123 \
            --no-daemon --stacktrace 2>&1 | tail -80

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahra-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.0
          name: "📱 زهرة — Build ${{ github.run_number }}"
          body: |
            ## تطبيق زهرة ✨

            ### تثبيت على أندرويد:
            1. حمّل **zahra.apk** أدناه
            2. افتحه على هاتفك
            3. اسمح بالتثبيت من مصادر غير معروفة
            4. اضغط **تثبيت** 🎉
          files: android/app/build/outputs/apk/release/app-release.apk
          asset_name: zahra.apk
