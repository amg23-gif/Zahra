name: بناء تطبيق زهرة APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup Android environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i 's/def enableProguardInReleaseBuilds = .*/def enableProguardInReleaseBuilds = false/' android/app/build.gradle || true
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m\norg.gradle.daemon=false\n' >> android/gradle.properties

      - name: Create keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/zahra.keystore -alias zahra \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Zahra,O=Zahra,C=MA" \
            -storepass zahra123 -keypass zahra123 -noprompt

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/zahra.keystore \
            -Pandroid.injected.signing.store.password=zahra123 \
            -Pandroid.injected.signing.key.alias=zahra \
            -Pandroid.injected.signing.key.password=zahra123 \
            --no-daemon

      - name: Verify APK exists
        run: |
          ls -lh android/app/build/outputs/apk/release/ || echo "No APK found"
          find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK anywhere"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zahra-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.0
          name: "📱 زهرة — Build ${{ github.run_number }}"
          body: |
            ## تطبيق زهرة ✨
            اضغط **zahra.apk** أدناه، ثبّته على هاتفك الأندرويد 🎉
          files: android/app/build/outputs/apk/release/app-release.apk
          asset_name: zahra.apk
