name: بناء تطبيق زهرة APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Bundle JavaScript into APK assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.0
          name: "📱 زهرة APK — Build ${{ github.run_number }}"
          body: |
            ## تطبيق زهرة ✨

            ### تثبيت على هاتف أندرويد:
            1. اضغط **zahra.apk** أدناه لتنزيله
            2. افتحه على هاتفك
            3. اسمح بالتثبيت من مصادر غير معروفة
            4. اضغط **تثبيت** 🎉

            ### مميزات التطبيق:
            - 🕌 مواقيت الصلاة + القبلة (بدون نت)
            - 📖 القرآن — 114 سورة، 4 مؤذنين
            - 📿 الأذكار — صباح/مساء/نوم/بعد الصلاة
            - 🔢 المسبحة — مع اهتزاز
            - 🔔 إشعارات الأذان يومياً
            - 💬 ترحيب صوتي بالدارجة المغربية باسم زهرة
          files: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: zahra.apk
