name: Build Android APK

  on:
    push:
      branches: [main]
    workflow_dispatch:

  jobs:
    build:
      name: Build APK (EAS)
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm

        - name: Install dependencies
          run: npm install

        - name: Setup Expo & EAS
          uses: expo/expo-github-action@v8
          with:
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}

        - name: Build Android APK
          run: eas build --platform android --profile preview --non-interactive --local --output ./zahra.apk

        - name: Upload APK as artifact
          uses: actions/upload-artifact@v4
          with:
            name: zahra-android-apk
            path: ./zahra.apk
            retention-days: 30

        - name: Create GitHub Release with APK
          if: github.ref == 'refs/heads/main'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ github.run_number }}
            name: "زهرة v${{ github.run_number }}"
            body: |
              ## تطبيق زهرة — رفيق إيماني يومي 🌿

              ### كيفية التثبيت على أندرويد:
              1. حمّلي ملف `zahra.apk` أدناه
              2. افتحيه على هاتفك
              3. اسمحي بتثبيت التطبيقات من مصادر غير معروفة إذا طُلب منك
              4. ثبّتي التطبيق وافتحيه

              ### مميزات التطبيق:
              - 🕌 أوقات الصلاة تلقائية حسب موقعك
              - 📖 القرآن مع 6 قراء
              - 🤲 الأذكار بالصوت
              - 📿 المسبحة
              - 💊 تذكير الدواء
              - 📞 اتصال طوارئ بالعائلة
              - 🎙️ مرشد صوتي بالدارجة المغربية
            files: ./zahra.apk
            draft: false
            prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  